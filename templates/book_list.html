{% extends "base.html" %}

{% block content %}


<body>
    <h1>Book List</h1>
    <ul>
        {% for book in books %} 
        <li>{{ book.title }} - {{ book.status }} - {{ book.publisher.name}}
        </li>
        {% for review in book.review_set.all %}
    <p>{{review.body}}</p>
{% endfor %}
{% endfor %}
    </ul>
</body>
{% endblock content %}
